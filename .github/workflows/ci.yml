name: Flutter CI

# Trigger this workflow on pushes and pull requests to the development branch
on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - uses: actions/checkout@v2

      # Set up Flutter environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.3.0' # Replace with your required version

      # Fetch Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # Build the Flutter app (you can specify Android, iOS, etc.)
      - name: Build APK
        run: flutter build apk --release

      # Run tests (optional but recommended)
      - name: Run tests
        run: flutter test
