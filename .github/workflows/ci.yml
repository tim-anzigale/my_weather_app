name: Flutter CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code from the repository
      - uses: actions/checkout@v2

      # Set up the latest stable version of Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Fetch Flutter dependencies
      - name: Install dependencies
        run: flutter pub get

      # Build the Flutter app (you can specify Android, iOS, etc.)
      - name: Build APK
        run: flutter build apk --release

      # Run tests (optional)
      - name: Run tests
        run: flutter test
